[project]
name = "firstlight"
version = "0.1.0"
description = "Real-time night operations for shrimp ponds, on MongoDB and Datadog."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # ddtrace's PyMongo integration breaks on 4.18 (DataDog/dd-trace-py#20119)
    "pymongo>=4.12,<4.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "ddtrace>=4.0",
    "datadog>=0.50",
    "google-genai>=1.0",
]

[project.scripts]
firstlight = "firstlight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstlight"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S311"]
# The simulator needs reproducible randomness, not cryptographic randomness.
"src/firstlight/edge/**" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
