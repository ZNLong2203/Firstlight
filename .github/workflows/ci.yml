name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongodb/mongodb-atlas-local:8.0.34
        ports: ["27017:27017"]
        env:
          MONGODB_INITDB_ROOT_USERNAME: firstlight
          MONGODB_INITDB_ROOT_PASSWORD: ci-only-not-a-secret
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 10s --health-timeout 30s --health-retries 12 --health-start-period 30s
    env:
      MONGODB_URI: mongodb://firstlight:ci-only-not-a-secret@localhost:27017/?directConnection=true&authSource=admin
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  images:
    if: github.event_name == 'push'
    needs: [python, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/firstlight:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            VITE_DD_VERSION=${{ github.sha }}
            VITE_DD_ENV=demo
          tags: ghcr.io/${{ github.repository_owner }}/firstlight-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
